atching it fail and drop it several times, I walked over to see what it was and took these pictures.\nGull is listed here: https://www.inaturalist.org/observations/260195676\n\nI don't know if the gull caught the fish or just found it. The gull walked back to continue trying after I retreated, and half an hour later the fish was gone. There had been some other gulls around, showing interest as well, so I don't know if it was swallowed whole, torn apart, or just carried off.  ", "iconicTaxon": "Actinopterygii", "category": "vertebrates"}, {"id": "Cactus Scattered Cochineal", "label": "Cactus Scattered Cochineal", "commonName": "Cactus Scattered Cochineal", "scientificName": "Dactylopius opuntiae", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/39568332", "description": "Unidentified", "iconicTaxon": "Insecta", "category": "invertebrates"}, {"id": "California Bee Assassin", "label": "California Bee Assassin", "commonName": "California Bee Assassin", "scientificName": "Apiomerus californicus", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/142450506", "description": "A Bee Assassin that just caught a Western Honey Bee on a Buckwheat.\n\nThe bee's observation: https://www.inaturalist.org/observations/142450505", "iconicTaxon": "Insecta", "category": "invertebrates"}, {"id": "California Ground Squirrel", "label": "California Ground Squirrel", "commonName": "California Ground Squirrel", "scientificName": "Otospermophilus beecheyi", "kingdom": "Animalia", "className": "Mammalia", "url": "https://www.inaturalist.org/observations/7303528", "description": "It's hard to see in the photo, but this ground squirrel was cannibalizing the carcass of another of its kind. The carcass was surrounded by other squirrels of varying ages, and although I didn't observe them eating I think it's safe to assume they were waiting to do so. Gotta get protein from somewhere...", "iconicTaxon": "Mammalia", "category": "vertebrates"}, {"id": "California Gull", "label": "California Gull", "commonName": "California Gull", "scientificName": "Larus californicus", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/54994450", "description": "Gulls feeding on brine flies by flying along the ground with their mouths open and trying to scoop up the flies as they take off. They would cruise along a section of beach and then circle back to do it again.\n\nThe Flies are listed here:\nhttps://www.inaturalist.org/observations/54994449\nAnd some gulls feeding on brine shrimp nearby are listed here:\nhttps://www.inaturalist.org/observations/54994451", "iconicTaxon": "Aves", "category": "vertebrates"}, {"id": "California King Snake", "label": "California King Snake", "commonName": "California King Snake", "scientificName": "Lampropeltis californiae", "kingdom": "Animalia", "className": "Reptilia", "url": "https://www.inaturalist.org/observations/12248949", "description": "Observation and photo by nature_is_mental sent via instagram #natureinla", "iconicTaxon": "Reptilia", "category": "vertebrates"}, {"id": "California Mussel", "label": "California Mussel", "commonName": "California Mussel", "scientificName": "Mytilus californianus", "kingdom": "Animalia", "className": "Bivalvia", "url": "https://www.inaturalist.org/observations/138339521", "description": "Clearly showing the line up to where Ochre Sea Stars\n(https://www.inaturalist.org/observations/138339520) can comfortably feed on them.", "iconicTaxon": "Mollusca", "category": "invertebrates"}, {"id": "California Sea Lion", "label": "California Sea Lion", "commonName": "California Sea Lion", "scientificName": "Zalophus californianus", "kingdom": "Animalia", "className": "Mammalia", "url": "http://www.inaturalist.org/observations/4150874", "description": "                               ", "iconicTaxon": "Mammalia", "category": "vertebrates"}, {"id": "California Vole", "label": "Califor Four-striped Grass Mouse", "scientificName": "Rhabdomys pumilio", "kingdom": "Animalia", "className": "Mammalia", "url": "https://www.inaturalist.org/observations/66602791", "description": "For the poor prey animal.", "iconicTaxon": "Mammalia", "category": "vertebrates"}, {"id": "Cape Gerbil", "label": "Cape Gerbil", "commonName": "Cape Gerbil", "scientificName": "Gerbilliscus afer", "kingdom": "Animalia", "className": "Mammalia", "url": "https://www.inaturalist.org/observations/147519996", "description": "Unidentified", "iconicTaxon": "Mammalia", "category": "vertebrates"}, {"id": "Cape Honey Bee", "label": "Cape Honey Bee", "commonName": "Cape Honey Bee", "scientificName": "Apis mellifera capensis", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/74702908", "description": "For what the spider was eating", "iconicTaxon": "Insecta", "category": "invertebrates"}, {"id": "Cape Honeysuckle", "label": "Cape Honeysuckle", "commonName": "Cape Honeysuckle", "scientificName": "Tecomaria capensis", "kingdom": "Plantae", "className": "Magnoliopsida", "url": "https://www.inaturalist.org/observations/73771779", "description": "See butterfly  https://www.inaturalist.org/observations/73771795", "iconicTaxon": "Plantae", "category": "plants"}, {"id": "Cape House Snake", "label": "Cape House Snake", "commonName": "Cape House Snake", "scientificName": "Boaedon capensis", "kingdom": "Animalia", "className": "Reptilia", "url": "https://www.inaturalist.org/observations/69904395", "description": "<h3>Frank's uh ... Brown Sparrowhawk strikes again</h3>\nPhotos kind courtesy of Frank Curtis.\n\nTook an hour and 20 minutes for the snake to subdue and swallow the Sparrow. Successfully this time.\n\nFascinating that a relatively large snake survives in a heavily built-up area in the middle of cat- and traffic-infested town.\n\nAlso, that a fundamentally nocturnal rodent-hunter has adapted to lie in wait for birds at the base of the garden  feeder, by day ...\n\nSee previous, unsuccessful, hunt, same place, probably all the very same characters!: https://www.inaturalist.org/observations/69292125 ", "iconicTaxon": "Reptilia", "category": "vertebrates"}, {"id": "Cape Rattlepod", "label": "Cape Rattlepod", "commonName": "Cape Rattlepod", "scientificName": "Crotalaria capensis", "kingdom": "Plantae", "className": "Magnoliopsida", "url": "https://www.inaturalist.org/observations/71616869", "description": "See bee  https://www.inaturalist.org/observations/71616870", "iconicTaxon": "Plantae", "category": "plants"}, {"id": "Cape Rock Hyrax", "label": "Cape Rock Hyrax", "commonName": "Cape Rock Hyrax", "scientificName": "Procavia capensis capensis", "kingdom": "Animalia", "className": "Mammalia", "url": "https://www.inaturalist.org/observations/145911511", "description": "See food plant  https://www.inaturalist.org/observations/145911514", "iconicTaxon": "Mammalia", "category": "vertebrates"}, {"id": "Cape Southern Fiscal", "label": "Cape Southern Fiscal", "commonName": "Cape Southern Fiscal", "scientificName": "Lanius collaris collaris", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/67130272", "description": "Photo credits: Etienne De Beer", "iconicTaxon": "Aves", "category": "vertebrates"}, {"id": "Cape Sugarbird", "label": "Cape Sugarbird", "commonName": "Cape Sugarbird", "scientificName": "Promerops cafer", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/258378272", "description": "Unidentified", "iconicTaxon": "Aves", "category": "vertebrates"}, {"id": "Cape Wild Dog", "label": "Cape Wild Dog", "commonName": "Cape Wild Dog", "scientificName": "Lycaon pictus pictus", "kingdom": "Animalia", "className": "Mammalia", "url": "http://www.inaturalist.org/observations/893936", "description": "In 2nd photo, Hooded Vultures (Necrosyrtes monachus) rapidly devour dog's faeces. Dog initially chased off vultures but relented after 3rd go", "iconicTaxon": "Mammalia", "category": "vertebrates"}, {"id": "Cape Wolf Snake", "label": "Cape Wolf Snake", "commonName": "Cape Wolf Snake", "scientificName": "Lycophidion capense", "kingdom": "Animalia", "className": "Reptilia", "url": "http://www.inaturalist.org/observations/414645", "description": "found lying in open on short grass. Cause of death unknown but during latter part of night.Tail damaged which made subcaudal count inexact but 28 considered very close.", "iconicTaxon": "Reptilia", "category": "vertebrates"}, {"id": "Carolina Mantis", "label": "Carolina Mantis", "commonName": "Carolina Mantis", "scientificName": "Stagmomantis carolina", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/244268104", "description": "Unidentified", "iconicTaxon": "Insecta", "category": "invertebrates"}, {"id": "Carolina Sphinx", "label": "Carolina Sphinx", "commonName": "Carolina Sphinx", "scientificName": "Manduca sexta", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/54167513", "description": "Unidentified", "iconicTaxon": "Insecta", "category": "invertebrates"}, {"id": "Carolinian Elegant", "label": "Carolinian Elegant", "commonName": "Carolinian Elegant", "scientificName": "Meromacrus acutus", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/19296443", "description": "7 part photostory, this one is for the fly\nPhoto 1:\n I Thought It Was A Yellowjacket\nWhen I came inside my house, what I thought was a yellow jacket came in with me.  This is a problem because I like to go barefoot and I have cats that could get stung also.  I went to get a broom to try to slap it down out of the air.  When I came back it had gone to a window with blinds.  I discovered that a tiny spider had solved my problem.  The \"yellow jacket\" had been caught in a web.  Later when I got the insect identified by experts, it turned out to be a fly pretending to be a yellow jacket.  This is an example of Batesian mimicry which is when a harmless, tasty species mimics another species that is toxic or foul tasting or dangerous in order to be protected from predators.  Sure fooled me.  It did not deter the spider.\nPhoto 2:\nSpider To The Rescue\nThe spider solved my problem.  Here is the spider coming to take a look at what it caught in its web.  I was shooting these photos through open blinds.\nPhoto 3:\nUnderside Of The Spider\nI took this shot to help with getting an id on the spider.\nPhoto 4:\nTopside Of The Spider\nAs the spider wrapped some silk around the fly's legs, I got a shot of the top side of the spider. \nPhoto 5:\nUncropped Shot For Perspective\nI left this shot uncropped to show how I was having to do this, shooting between two blinds slats.     \nPhoto 6:\nSpider Injects venom\nThe spider may have been fooled by the mimicry because it avoided the end of the fly where a stinger would be if it were a wasp.  What the spider did, as shown here, was to bite the leg which injected venom.  The fly stopped struggling shortly after that.\nPhoto 7:\nThe Spider Won\nI had to leave at this point so took this last photo of the spider.  Several hours later when I got back the fly was wrapped up in silk for a later meal.  The next morning there was nothing left to be seen.\nFly  id confirmed in bugguide here:  https://bugguide.net/node/view/1616641", "iconicTaxon": "Insecta", "category": "invertebrates"}, {"id": "Caustic Vine", "label": "Caustic Vine", "commonName": "Caustic Vine", "scientificName": "Cynanchum viminale", "kingdom": "Plantae", "className": "Magnoliopsida", "url": "https://www.inaturalist.org/observations/82325223", "description": "See butterfly  https://www.inaturalist.org/observations/82325221\nSee butterfly  https://www.inaturalist.org/observations/82325222\n", "iconicTaxon": "Plantae", "category": "plants"}, {"id": "Cavorting Emperor", "label": "Cavorting Emperor", "commonName": "Cavorting Emp  Combfoot", "commonName": "Triangulate Combfoot", "scientificName": "Steatoda triangulosa", "kingdom": "Animalia", "className": "Arachnida", "url": "https://www.inaturalist.org/observations/19296614", "description": "7 part photostory, this one is for the spider which can be seen in 2nd and succeeding photos.\nPhoto 1: \nI Thought It Was A Yellowjacket \nWhen I came inside my house, what I thought was a yellow jacket came in with me. This is a problem because I like to go barefoot and I have cats that could get stung also. I went to get a broom to try to slap it down out of the air. When I came back it had gone to a window with blinds. I discovered that a tiny spider had solved my problem. The \"yellow jacket\" had been caught in a web. Later when I got the insect identified by experts, it turned out to be a fly pretending to be a yellow jacket. This is an example of Batesian mimicry which is when a harmless, tasty species mimics another species that is toxic or foul tasting or dangerous in order to be protected from predators. Sure fooled me. It did not deter the spider. \nPhoto 2: \nSpider To The Rescue \nThe spider solved my problem. Here is the spider coming to take a look at what it caught in its web. I was shooting these photos through open blinds. \nPhoto 3: \nUnderside Of The Spider \nI took this shot to help with getting an id on the spider. \nPhoto 4: \nTopside Of The Spider \nAs the spider wrapped some silk around the fly's legs, I got a shot of the top side of the spider. \nPhoto 5: \nUncropped Shot For Perspective \nI left this shot uncropped to show how I was having to do this, shooting between two blinds slats. \nPhoto 6: \nSpider Injects venom \nThe spider may have been fooled by the mimicry because it avoided the end of the fly where a stinger would be if it were a wasp. What the spider did, as shown here, was to bite the leg which injected venom. The fly stopped struggling shortly after that. \nPhoto 7: \nThe Spider Won \nI had to leave at this point so took this last photo of the spider. Several hours later when I got back the fly was wrapped up in silk for a later meal. The next morning there was nothing left to be seen.        ", "iconicTaxon": "Arachnida", "category": "invertebrates"}, {"id": "Tridax daisy", "label": "Tridax daisy", "commonName": "Tridax daisy", "scientificName": "Tridax procumbens", "kingdom": "Plantae", "className": "Magnoliopsida", "url": "https://www.inaturalist.org/observations/72616635", "description": "See butterfly  https://www.inaturalist.org/observations/72616632", "iconicTaxon": "Plantae", "category": "plants"}, {"id": "Tropical Carpenter Ant", "label": "Tropical Carpenter Ant", "commonName": "Tropical Carpenter Ant", "scientificName": "Camponotus atriceps", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/262520602", "description": "A formiga ", "iconicTaxon": "Insecta", "category": "invertebrates"}, {"id": "Tropical House Gecko", "label": "Tropical House Gecko", "commonName": "Tropical House Gecko", "scientificName": "Hemidactylus mabouia", "kingdom": "Animalia", "className": "Reptilia", "url": "https://www.inaturalist.org/observations/18141580", "description": "Unidentified", "iconicTaxon": "Reptilia", "category": "vertebrates"}, {"id": "Tropical Mockingbird", "label": "Tropical Mockingbird", "commonName": "Tropical Mockingbird", "scientificName": "Mimus gilvus", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/69384807", "description": "Observation for the prey not the falcon", "iconicTaxon": "Aves", "category": "vertebrates"}, {"id": "Trumpeter Hornbill", "label": "Trumpeter Hornbill", "commonName": "Trumpeter Hornbill", "scientificName": "Bycanistes bucinator", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/144668595", "description": "Unidentified", "iconicTaxon": "Aves", "category": "vertebrates"}, {"id": "Tufted Titmouse", "label": "Tu       const fullscreenToggle = document.getElementById('fullscreenToggle');
      const updateFullscreenButton = () => {
        if (!fullscreenToggle) return;
        fullscreenToggle.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
      };
      fullscreenToggle?.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          containerEl?.requestFullscreen?.();
        } else {
          document.exitFullscreen?.();
        }
      });
      document.addEventListener('fullscreenchange', updateFullscreenButton);
      updateFullscreenButton();

      const toggleCommon = document.getElementById('toggleCommon');
      const toggleScientific = document.getElementById('toggleScientific');
      const downloadButton = document.getElementById('downloadNetworkBtn');

      const sanitizeFileName = (value) =>
        value.replace(/[\/:*?"<>|]/g, '').trim() || 'who-eats-whom-network';

      const buildStandaloneHtml = () => {
        const clone = document.documentElement.cloneNode(true);
        if (!(clone instanceof HTMLElement)) {
          return document.documentElement.outerHTML;
        }
        const svg = clone.querySelector('#network');
        if (svg) {
          while (svg.firstChild) {
            svg.removeChild(svg.firstChild);
          }
        }
        const downloadBtn = clone.querySelector('#downloadNetworkBtn');
        downloadBtn?.parentElement?.removeChild(downloadBtn);
        return '<!DOCTYPE html>\n' + clone.outerHTML;
      };

      const handleLabelToggle = (type, checked) => {
        if (type === 'common') {
          if (!checked && !showScientificNames) {
            toggleCommon.checked = true;
            return;
          }
          showCommonNames = checked;
        } else {
          if (!checked && !showCommonNames) {
            toggleScientific.checked = true;
            return;
          }
          showScientificNames = checked;
        }
        updateLabels();
      };

      toggleCommon?.addEventListener('change', (event) =>
        handleLabelToggle('common', event.target.checked)
      );
      toggleScientific?.addEventListener('change', (event) =>
        handleLabelToggle('scientific', event.target.checked)
      );
      downloadButton?.addEventListener('click', () => {
        const html = buildStandaloneHtml();
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${sanitizeFileName('who-eats-whom-network')}.html`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      });

      const searchInput = document.getElementById('searchBox');
      const searchButton = document.getElementById('searchButton');

      function clearHighlights() {
        node.classed('highlight', false);
        link.classed('highlight', false);
      }

      function focusNode(nodeData) {
        const scale = 1.6;
        const transform = d3.zoomIdentity
          .translate(width / 2, height / 2)
          .scale(scale)
          .translate(-nodeData.x, -nodeData.y);

        svg.transition().duration(650).call(zoomBehaviour.transform, transform);
      }

      const findNodeMatch = (value) => {
        const term = value.trim().toLowerCase();
        if (!term) return null;
        return graphData.nodes.find((n) => {
          const candidates = [n.id, n.label, n.commonName, n.scientificName];
          return candidates.some(
            (entry) => typeof entry === 'string' && entry.toLowerCase() === term
          );
        });
      };

      function highlightNode(value) {
        const match = findNodeMatch(value);
        clearHighlights();
        if (match) {
          node.filter(d => d.id === match.id).classed('highlight', true);
          link.filter(d => d.source.id === match.id || d.target.id === match.id)
            .classed('highlight', true);
          focusNode(match);
        } else {
          alert(`No match found for "${value}"`);
        }
      }

      searchButton.addEventListener('click', () => highlightNode(searchInput.value));
      searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          highlightNode(searchInput.value);
        }
        if (event.key === 'Escape') {
          clearHighlights();
          searchInput.value = '';
        }
      });

      const legend = document.getElementById('legend');
      if (legend) {
        legend.innerHTML = '';
      }
      legendItems.forEach((entry) => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        const swatch = document.createElement('span');
        swatch.className = 'legend-color';
        swatch.style.background = entry.color;

        const info = document.createElement('div');
        info.className = 'legend-info';

        const label = document.createElement('div');
        label.className = 'legend-label';
        label.textContent = entry.label;

        const taxa = document.createElement('div');
        taxa.className = 'legend-taxa';
        taxa.textContent = entry.taxa.join(', ');

        info.appendChild(label);
        info.appendChild(taxa);
        item.appendChild(swatch);
        item.appendChild(info);
        legend.appendChild(item);
      });

      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }

      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }

      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }

      const controlsMC = document.getElementById('mainControls');
      const collapseIconSpan = document.getElementById('collapseIcon');
      const controlsHeader = document.getElementById('controlsHeader');
      
      function toggleControls() {
        const isCollapsed = controlsMC.classList.contains('collapsed');
        if (isCollapsed) {
          controlsMC.classList.remove('collapsed');
          collapseIconSpan.textContent = '-';
        } else {
          controlsMC.classList.add('collapsed');
          collapseIconSpan.textContent = '+';
        }
      }
      
      if (controlsHeader) {
        controlsHeader.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleControls();
        });
      }
      
      window.addEventListener('resize', () => {
        const newWidth = window.innerWidth;
        const newHeight = window.innerHeight;
        svg.attr('viewBox', [0, 0, newWidth, newHeight]);
        simulation.force('center', d3.forceCenter(newWidth / 2, newHeight / 2));
        simulation.alphaTarget(0.1).restart();
        setTimeout(() => simulation.alphaTarget(0), 500);
      });
    </script>
  </body>
</html>
