<script type="text/javascript">
  function caseInsensitiveFocus() {
    var val = document.getElementById('searchBox').value.trim().toLowerCase();
    var nodes = network.body.data.nodes.get();
    var match = nodes.find(function(n){
      return String(n.id).toLowerCase() === val;
    });
    if (match) {
      network.focus(match.id, {scale:1.5, animation:{duration:300}});
    } else {
      alert('Node not found: ' + val);
    }
  }
</script>

-Flower Pawpaw\u003c/b\u003e\u003cbr\u003eTaxon Kingdom Name: Plantae\u003cbr\u003eTaxon Class Name: Magnoliopsida\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/221016471\u0027 target=\u0027_blank\u0027\u003ehttps://www.inaturalist.org/observations/221016471\u003c/a\u003e\u003cbr\u003eDescription: This is the nicest looking wild pawpaw on the property. Seems to be a good combo of enough leaf litter (large oaks and magnolias nearby) and not too much shade. There is one larger than this at the edge of the forested area. It has the best soil but also the least light. It never seems to have any fruit. There are several other smaller ones in sunnier sandier areas. I have never gotten to try the fruit since animals always get them first. They are great for attracting Zebra Swallowtails though. Caterpillar on this bush: https://www.inaturalist.org/observations/221016473\r\n\r\nIt\u0027s too expensive to water the garden enough for most vegetables with such sandy soil. Hence the container gardening. So this pawpaw is not getting any special treatment. It looked terrible during the severe drought last year (some wild bushes and trees died), but it bounced right back."}, {"color": "#E76F51", "id": "Black Turnstone", "label": "Black Turnstone", "shape": "dot", "title": "\u003cb\u003eBlack Turnstone\u003c/b\u003e\u003cbr\u003eTaxon Kingdom Name: Animalia\u003cbr\u003eTaxon Class Name: Aves\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/251498320\u0027 target=\u0027_blank\u0027\u003ehttps://www.inaturalist.org/observations/251498320\u003c/a\u003e\u003cbr\u003eDescription: Several of these little guys were seen pulling the floating sand crab carcasses from the water and picking at them: https://www.inaturalist.org/observations/251498321\r\nThough I think they were mostly molts and didn\u0027t have much left to eat.\r\n  "}, {"color": "#E76F51", "id": "Lesser Goldfinch", "label": "Lesser Goldfinch", "sh get=\u0027_blank\u0027\u003ehttps://www.inaturalist.org/observations/19970520\u003c/a\u003e\u003cbr\u003eDescription: Unidentified"}, {"color": "#2A9D8F", "id": "Bluegill", "label": "Bluegill", "shape": "dot", "title": "\u003cb\u003eBluegill\u003c/b\u003e\u003cbr\u003eTaxon Kingdom Name: Animalia\u003cbr\u003eTaxon Class Name: Actinopterygii\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/111833439\u0027 target=\u0027_blank\u0027\u003ehttps://www.inaturalist.org/observations/111833439\u003c/a\u003e\u003cbr\u003eDescription: Found beneath a Great Blue Heron rookery (along with several other fish)."}, {"color": "#E76F51", "id": "Triangulate Combfoot", "label": "Triangulate Combfoot", "shape": "dot", "title": "\u003cb\u003eTriangulate Combfoot\u003c/b\u003e\u003cbr\u003eTaxon Kingdom Name: Animalia\u003cbr\u003eTaxon Class Name: Arachnida\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/19296614\u0027 target=\u0027_blank\u0027\u003ehttps://www.inaturalist.org/observations/19296614\u003c/a\u003e\u003cbr\u003eDescription: 7 part photostory, this one is for the spider which can be seen in 2nd and succeeding photos.\r\nPhoto 1: \r\nI Thought It Was A Yellowjacket \r\nWhen I came inside my house, what I thought was a yellow jacket came in with me. This is a problem because I like to go barefoot and I have cats that could get stung also. I went to get a broom to try to slap it down out of the air. When I came back it had gone to a window with blinds. I discovered that a tiny spider had solved my problem. The \"yellow jacket\" had been caught in a web. Later when I got the insect identified by experts, it turned out to be a fly pretending to be a yellow jacket. This is an example of Batesian mimicry which is when a harmless, tasty species mimics another species that is toxic or foul tasting or dangerous in order to be protected from predators. Sure fooled me. It did not deter the spider. \r\nPhoto 2: \r\nSpider To The Rescue \r\nThe spider solved my problem. Here is the spider coming to take a look at what it caught in its web. I was shooting these photos through open blinds. \r\nPhoto 3: \r\nUnderside Of The Spider \r\nI took this shot to help with getting an id on the spider. \r\nPhoto 4: \r\nTopside Of The Spider \r\nAs the spider wrapped some silk around the fly\u0027s legs, I got a shot of the top side of the spider. \r\nPhoto 5: \r\nUncropped Shot For Perspective \r\nI left this shot uncropped to show how I was having to do this, shooting between two blinds slats. \r\nPhoto 6: \r\nSpider Injects venom \r\nThe spider may have been fooled by the mimicry because it avoided the end of the fly where a stinger would be if it were a wasp. What the spider did, as shown here, was to bite the leg which injected venom. The fly stopped struggling shortly after that. \r\nPhoto 7: \r\nThe Spider Won \r\nI had to leave at this point so took this last photo of the spider. Several hours later when I got back the fly was wrapped up in silk for a later meal. The next morning there was nothing left to be seen.        "}, {"color": "#2A9D8F", "id": "Metallic Bluish-green Cuckoo Wasp", "label": "Metallic Bluish-green Cuckoo Wasp", "shape": "dot", "title": "\u003cb\u003eMetallic Bluish-green Cuckoo Wasp\u003c/b\u003e\u003cbr\u003eTaxon Kingdom Name: Animalia\u003cbr\u003eTaxon Class Name: Insecta\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/185160553\u0027 target=\u0027_blank\u0027\u003ehttps://www.inaturalist.org/observations/185160553\u003c/a\u003e\u003cbr\u003eDescription: Unidentified"}, {"color": "#2A9D8F", "id": "Striped Painted Reedfrog", "label": "Striped Painted Reedfrog", "shape": "dot", "title": "\u003cb\u003eStriped Painted Reedfrog\u003c/b\u003e\u003cbr\u003eTaxon Kingdom Name: Animalia\u003cbr\u003eTaxon Class Name: Amphibia\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/20163778\u0027 t Rhombic Night Adder", "label": "Rhombic Night Adder", "shape": "dot", "title": "\u003cb\u003eRhombic Night Adder\u003c/b\u003e\u003cbr\u003eTaxon Kingdom Name: Animalia\u003cbr\u003eTaxon Class Name: Reptilia\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/103519418\u0027 target=\u0027_blank\u0027\u003ehttps://www.inaturalist.org/observations/103519418\u003c/a\u003e\u003cbr\u003eDescription: I came across the pair apparently shortly after the snake had bitten the toad, around 14:30. In the video the adder can be seen giving the toad a second bite.\r\nThe snake started swallowing the toad at 14:38, the toad still struggling strongly. The toad stopped moving at around 14:41.\r\nInitially I started filming on my phone as the snake was blocking the path to my camera and I didn\u0027t want to disturb it. An hour in (15:30), it was apparent that the snake was untroubled by the various humans and cats watching it, and I swapped to the camera.\r\nBy 16:50 the snake had swallowed the toad up to its hips. At 17:16 it partially regurgitated the prey and started swallowing again.\r\nAt 17:36 it again regurgitated a large portion of the toad - its front legs and feet were visible.\r\nAt 17:56 only the back legs were still protruding.\r\nThe toad was completely swallowed at 18:09, 3.5 hours in all.\r\nThe video (3mins 30 sec) is edited and speeded up 2x.\r\n\r\nVideo\r\nhttps://youtu.be/hejRBqj_PS0\r\n"}, {"color": "#2A9D8F", "id": "Raucous Toad", "label": "Raucous Toad", "shape": "dot", "title": "\u003cb\u003eRaucous Toad\u003c/b\u003e\u003cbr\u003eTaxon Kingdom Name: Animalia\u003cbr\u003eTaxon Class Name: Amphibia\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/209230070\u0027 target=\u0027_blank\u0027\u003ehttps://www.inaturalist.org/observations/209230070\u003c/a\u003e\u003cbr\u003eDescription: Looks like a road kill."}, {"color": "#F4A261", "id": "Kurrichane Thrush", "label": "Kurrichane Thrush", "s lass Name: Reptilia\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/32920310\u0027 target=\u0027_blank\u0027\u003ehttps://www.inaturalist.org/observations/32920310\u003c/a\u003e\u003cbr\u003eDescription: A few minutes ago, I spotted a green anole hunting in an area where frostweeds, yellow passionflowers, and late bonesets are blooming and attracting a variety of bees, wasps, and flies.  In picture 1, there is a fly on a late bonset bloom just below the lizard.  In the left corner, there is a wasp barely visible in the late boneset.  On the yellow passionflower bloom, there is a small red-banded hairstreak. Picture 2 is a closeup of the hunter.  Picture 3 shows that it now has locked on to the hairstreak as a target. Picture 4  shows the lizard patiently getting ready.  Picture 5 and 6 were taken just before the lizard pounced on its prey.  Pictures 7, 8, and 9 show the lizard after it has captured the hairstreak and moves about with the hairstreak in its mouth.  "}, {"color": "#2A9D8F", "id": "narrowleaf milkweed", "label": "narrowleaf milkweed", "shape": "dot", "title": "\u003cb\u003enarrowleaf milkweed\u003c/b\u003e\u003cbr\u003eTaxon Kingdom Name: Plantae\u003cbr\u003eTaxon Class Name: Magnoliopsida\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/179761552\u0027 target=\u0027_blank\u0027\u003ehttps://www.inaturalist.org/observations/179761552\u003c/a\u003e\u003cbr\u003eDescription: Unidentified"}, {"color": "#E76F51", "id": "Sunburst Anemone", "label": "Sunburst Anemone", "shape": "dot", "title": "\u003cb\u003eSunburst Anemone\u003c/b\u003e\u003cbr\u003eTaxon Kingdom Name: Animalia\u003cbr\u003eTaxon Class Name: Anthozoa\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/260195669\u0027 target=\u0027_blank\u0027\u003ehttps://www.inaturalist.org/observations/260195669\u003c/a\u003e\u003cbr\u003eDescription: An anemone devouring a rather large crab, liste servations/45126488\u003c/a\u003e\u003cbr\u003eDescription: Predated upon by a black-chested buzzard eagle. corresponding observation https://www.inaturalist.org/observations/13672038"}, {"color": "#2A9D8F", "id": "Carolinian Elegant", "label": "Carolinian Elegant", "shape": "dot", "title": "\u003cb\u003eCarolinian Elegant\u003c/b\u003e\u003cbr\u003eTaxon Kingdom Name: Animalia\u003cbr\u003eTaxon Class Name: Insecta\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/19296443\u0027 target=\u0027_blank\u0027\u003ehttps://www.inaturalist.org/observations/19296443\u003c/a\u003e\u003cbr\u003eDescription: 7 part photostory, this one is for the fly\r\nPhoto 1:\r\n I Thought It Was A Yellowjacket\r\nWhen I came inside my house, what I thought was a yellow jacket came in with me.  This is a problem because I like to go barefoot and I have cats that could get stung also.  I went to get a broom to try to slap it down out of the air.  When I came back it had gone to a window with blinds.  I discovered that a tiny spider had solved my problem.  The \"yellow jacket\" had been caught in a web.  Later when I got the insect identified by experts, it turned out to be a fly pretending to be a yellow jacket.  This is an example of Batesian mimicry which is when a harmless, tasty species mimics another species that is toxic or foul tasting or dangerous in order to be protected from predators.  Sure fooled me.  It did not deter the spider.\r\nPhoto 2:\r\nSpider To The Rescue\r\nThe spider solved my problem.  Here is the spider coming to take a look at what it caught in its web.  I was shooting these photos through open blinds.\r\nPhoto 3:\r\nUnderside Of The Spider\r\nI took this shot to help with getting an id on the spider.\r\nPhoto 4:\r\nTopside Of The Spider\r\nAs the spider wrapped some silk around the fly\u0027s legs, I got a shot of the top side of the spider. \r\nPhoto 5:\r\nUncropped Shot For Perspective\r\nI left this shot uncropped to show how I was having to do this, shooting between two blinds slats.     \r\nPhoto 6:\r\nSpider Injects venom\r\nThe spider may have been fooled by the mimicry because it avoided the end of the fly where a stinger would be if it were a wasp.  What the spider did, as shown here, was to bite the leg which injected venom.  The fly stopped struggling shortly after that.\r\nPhoto 7:\r\nThe Spider Won\r\nI had to leave at this point so took this last photo of the spider.  Several hours later when I got back the fly was wrapped up in silk for a later meal.  The next morning there was nothing left to be seen.\r\nFly  id confirmed in bugguide here:  https://bugguide.net/node/view/1616641"}, {"color": "#E76F51", "id": "Clouded Flat", "label": "Clouded Flat", "shape": "dot", "title": "\u003cb\u003eClouded Flat\u003c/b\u003e\u003cbr\u003eTaxon Kingdom Name: Animalia\u003cbr\u003eTaxon Class Name: Insecta\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/75566737\u0027 target=\u0027_blank\u0027\u003ehttps://www.inaturalist.org/observations/75566737\u003c/a\u003e\u003cbr\u003eDescription: See plant  https://www.inaturalist.org/observations/75566738"}, {"color": "#E76F51", "id": "Brown Widow", "label": "Brown Widow", "shape": "dot", "title": "\u003cb\u003eBrown Widow\u003c/b\u003e\u003cbr\u003eTaxon Kingdom Name: Animalia\u003cbr\u003eTaxon Class Name: Arachnida\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/10309167\u0027 target=\u0027_blank\u0027\u003ehttps://www.inaturalist.org/observations/10309167\u003c/a\u003e\u003cbr\u003eDescription: Unidentified"}, {"color": "#2A9D8F", "id": "Giant Leopard Moth", "label": "Giant Leopard Moth", "shape": "dot", "title": "\u003cb\u003eGiant Leopard Moth\u003c/b\u003e\u003cbr\u003eTaxon Kingdom Name: Animalia\u003cbr\u003eTaxon Class Name: Insecta\u003cbr\u003eExample URL: \u003ca href=\u0027https://www.inaturalist.org/observations/173893870\u0027 target=\u0027_blank\u0027\u0                           // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
