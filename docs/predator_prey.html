are the precise location of any photos from the trip since we were going to some private/secret/sacred locations throughout the week that see trespassers often. I figured it would be better to be overprotective rather than accidentally share something I shouldn't have, so I have edited the accuracy to cover the entire island.", "iconicTaxon": "Insecta"}, {"id": "Baird's Beaked Whale", "label": "Baird's Beaked Whale", "kingdom": "Animalia", "className": "Mammalia", "url": "https://www.inaturalist.org/observations/140816217", "description": "One of my favorite animals ever. I'm so happy I was able to see these, so I figured I'd make it extra-special by turning a video I took into a gif!!! The YouTube video can be found here: https://www.youtube.com/watch?v=jIPZzfd9zTc", "iconicTaxon": "Mammalia"}, {"id": "Bald Eagle", "label": "Bald Eagle", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/21591413", "description": "DuPuis Wildlife &amp; Environmental Area, PBC &amp; Martin County, FL", "iconicTaxon": "Aves"}, {"id": "Bald-faced Hornet", "label": "Bald-faced Hornet", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/61534896", "description": "Unidentified", "iconicTaxon": "Insecta"}, {"id": "Ballyhoo", "label": "Ballyhoo", "kingdom": "Animalia", "className": "Actinopterygii", "url": "https://www.inaturalist.org/observations/128973222", "description": "Brown Booby: https://www.inaturalist.org/observations/128973220", "iconicTaxon": "Actinopterygii"}, {"id": "Baltimore Oriole", "label": "Baltimore Oriole", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/42516960", "description": "Unidentified", "iconicTaxon": "Aves"}, {"id": "Banded Garden Spider", "label": "Banded Garden Spider", "kingdom": "Animalia", "className": "Arachnida", "url": "http://www.inaturalist.org/observations/3174469", "description": "Unidentified", "iconicTaxon": "Arachn s://www.inaturalist.org/observations/66602791", "description": "For the poor prey animal.", "iconicTaxon": "Mammalia"}, {"id": "Cape Gerbil", "label": "Cape Gerbil", "kingdom": "Animalia", "className": "Mammalia", "url": "https://www.inaturalist.org/observations/147519996", "description": "Unidentified", "iconicTaxon": "Mammalia"}, {"id": "Cape Honey Bee", "label": "Cape Honey Bee", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/74702908", "description": "For what the spider was eating", "iconicTaxon": "Insecta"}, {"id": "Cape Honeysuckle", "label": "Cape Honeysuckle", "kingdom": "Plantae", "className": "Magnoliopsida", "url": "https://www.inaturalist.org/observations/73771779", "description": "See butterfly  https://www.inaturalist.org/observations/73771795", "iconicTaxon": "Plantae"}, {"id": "Cape House Snake", "label": "Cape House Snake", "kingdom": "Animalia", "className": "Reptilia", "url": "https://www.inaturalist.org/observations/69904395", "description": "<h3>Frank's uh ... Brown Sparrowhawk strikes again</h3>\nPhotos kind courtesy of Frank Curtis.\n\nTook an hour and 20 minutes for the snake to subdue and swallow the Sparrow. Successfully this time.\n\nFascinating that a relatively large snake survives in a heavily built-up area in the middle of cat- and traffic-infested town.\n\nAlso, that a fundamentally nocturnal rodent-hunter has adapted to lie in wait for birds at the base of the garden  feeder, by day ...\n\nSee previous, unsuccessful, hunt, same place, probably all the very same characters!: https://www.inaturalist.org/observations/69292125 ", "iconicTaxon": "Reptilia"}, {"id": "Cape Rattlepod", "label": "Cape Rattlepod", "kingdom": "Plantae", "className": "Magnoliopsida", "url": "https://www.inaturalist.org/observations/71616869", "description": "See bee  https://www.inaturalist.org/observations/71616870", "iconicTaxon": "Plantae"}, {"id": "Cape Rock Hyrax", "label": "Cape Rock Hyrax", "kingdom": "Animalia", "className": "Mammalia", "url": "https://www.inaturalist.org/observations/145911511", "description": "See food plant  https://www.inaturalist.org/observations/145911514", "iconicTaxon": "Mammalia"}, {"id": "Cape Southern Fiscal", "label": "Cape Southern Fiscal", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/67130272", "description": "Photo credits: Etienne De Beer", "iconicTaxon": "Aves"}, {"id": "Cape Sugarbird", "label": "Cape Sugarbird", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/258378272", "description": "Unidentified", "iconicTaxon": "Aves"}, {"id": "Cape Wild Dog", "label": "Cape Wild Dog", "kingdom": "Animalia", "className": "Mammalia", "url": "http://www.inaturalist.org/observations/893936", "description": "In 2nd photo, Hooded Vultures (Necrosyrtes monachus) rapidly devour dog's faeces. Dog initially chased off vultures but relented after 3rd go", "iconicTaxon": "Mammalia"}, {"id": "Cape Wolf Snake", "label": "Cape Wolf Snake", "kingdom": "Animalia", "className": "Reptilia", "url": "http://www.inaturalist.org/observations/414645", "description": "found lying in open on short grass. Cause of death unknown but during latter part of night.Tail damaged which made subcaudal count inexact but 28 considered very close.", "iconicTaxon": "Reptilia"}, {"id": "Carolina Mantis", "label": "Carolina Mantis", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/244268104", "description": "Unidentified", "iconicTaxon": "Insecta"}, {"id": "Carolina Sphinx", "label": "Carolina Sphinx", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/54167513", "description": "Unidentified", "iconicTaxon": "Insecta"}, {"id": "Carolinian Elegant", "label": "Carolinian Elegant", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/19296443", "description": "7 part photostory, this one is for the fly\nPhoto 1:\n I Thought It Was A Yellowjacket\nWhen I came inside my house, what I thought was a yellow jacket came in with me.  This is a problem because I like to go barefoot and I have cats that could get stung also.  I went to get a broom to try to slap it down out of the air.  When I came back it had gone to a window with blinds.  I discovered that a tiny spider had solved my problem.  The \"yellow jacket\" had been caught in a web.  Later when I got the insect identified by experts, it turned out to be a fly pretending to be a yellow jacket.  This is an example of Batesian mimicry which is when a harmless, tasty species mimics another species that is toxic or foul tasting or dangerous in order to be protected from predators.  Sure fooled me.  It did not deter the spider.\nPhoto 2:\nSpider To The Rescue\nThe spider solved my problem.  Here is the spider coming to take a look at what it caught in its web.  I was shooting these photos through open blinds.\nPhoto 3:\nUnderside Of The Spider\nI took this shot to help with getting an id on the spider.\nPhoto 4:\nTopside Of The Spider\nAs the spider wrapped some silk around the fly's legs, I got a shot of the top side of the spider. \nPhoto 5:\nUncropped Shot For Perspective\nI left this shot uncropped to show how I was having to do this, shooting between two blinds slats.     \nPhoto 6:\nSpider Injects venom\nThe spider may have been fooled by the mimicry because it avoided the end of the fly where a stinger would be if it were a wasp.  What the spider did, as shown here, was to bite the leg which injected venom.  The fly stopped struggling shortly after that.\nPhoto 7:\nThe Spider Won\nI had to leave at this point so took this last photo of the spider.  Several hours later when I got back the fly was wrapped up in silk for a later meal.  The next morning there was nothing left to be seen.\nFly  id confirmed in bugguide here:  https://bugguide.net/node/view/1616641", "iconicTaxon": "Insecta"}, {"id": "Caustic Vine", "label": "Caustic Vine", "kingdom": "Plantae", "className": "Magnoliopsida", "url": "https://www.inaturalist.org/observations/82325223", "description": "See butterfly  https://www.inaturalist.org/observations/82325221\nSee butterfly  https://www.inaturalist.org/observations/82325222\n", "iconicTaxon": "Plantae"}, {"id": "Cavorting Emperor", "label": "Cavorting Emperor", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/66665825", "description": "See plant  https://www.inaturalist.org/observations/66665827\nSee pupa  https://www.inaturalist.org/observations/69102407\nSee imago  https://www.inaturalist.org/observations/69102411\nSee pupa  https://www.inaturalist.org/observations/71699336\nSee imago  https://www.inaturalist.org/observations/71699349", "iconicTaxon": "Insecta"}, {"id": "Ceanothus Silk Moth", "label": "Ceanothus Silk Moth", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/130896079", "description": "Unidentified", "iconicTaxon": "Insecta"}, {"id": "Cedar Waxwing", "label": "Cedar Waxwing", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/20416800", "description": "Flock of about 40, munching fruit like there's no tomorrow. ", "iconicTaxon": "Aves"}, {"id": "Chameleon Goby", "label": "Chameleon Goby", "kingdom": "Animalia", "className": "Actinopterygii", "url": "https://www.inaturalist.org/observations/144768063", "description": "Cropped from the photos of the stilt listed here:\nhttps://www.inaturalist.org/observations/144768062", "iconicTaxon": "Actinopterygii"}, {"id": "Channel Catfish", "label": "Channel Catfish", "kingdom": "Animalia", "className": "Actinopterygii", "url": "https://www.inaturalist.org/observations/83547109", "description": "Unidentified", "iconicTaxon": "Actinopterygii"}, {"id": "Checkered Garter Snake", "label": "Checkered Garter Snake", "kingdom": "Animalia toad stopped moving at around 14:41.\nInitially I started filming on my phone as the snake was blocking the path to my camera and I didn't want to disturb it. An hour in (15:30), it was apparent that the snake was untroubled by the various humans and cats watching it, and I swapped to the camera.\nBy 16:50 the snake had swallowed the toad up to its hips. At 17:16 it partially regurgitated the prey and started swallowing again.\nAt 17:36 it again regurgitated a large portion of the toad - its front legs and feet were visible.\nAt 17:56 only the back legs were still protruding.\nThe toad was completely swallowed at 18:09, 3.5 hours in all.\nThe video (3mins 30 sec) is edited and speeded up 2x.\n\nVideo\nhttps://youtu.be/hejRBqj_PS0\n", "iconicTaxon": "Reptilia"}, {"id": "Rice Stink Bug", "label": "Rice Stink Bug", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/227229453", "description": "Unidentified", "iconicTaxon": "Insecta"}, {"id": "Richards Bay Red Millipede", "label": "Richards Bay Red Millipede", "kingdom": "Animalia", "className": "Diplopoda", "url": "https://www.inaturalist.org/observations/245732252", "description": "See muncher of several millipedes  https://www.inaturalist.org/observations/245732259", "iconicTaxon": "Animalia"}, {"id": "Ridged Carrion Beetle", "label": "Ridged Carrion Beetle", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/201428636", "description": "Unidentified", "iconicTaxon": "Insecta"}, {"id": "Ring-billed Gull", "label": "Ring-billed Gull", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/155707589", "description": "Unidentified", "iconicTaxon": "Aves"}, {"id": "Ring-legged Earwig", "label": "Ring-legged Earwig", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/251923782", "description": "Unidentified", "iconicTaxon": "Insecta"}, {"id": "Ring-necke vations/12423948", "description": "Big green caterpillar with a tiny black tail for Sunday lunch.\nSee the bird  https://www.inaturalist.org/observations/12423946", "iconicTaxon": "Insecta"}, {"id": "Small White", "label": "Small White", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/45821977", "description": "Unidentified", "iconicTaxon": "Insecta"}, {"id": "Small pugnacious ant", "label": "Small pugnacious ant", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/67740506", "description": "Unidentified", "iconicTaxon": "Insecta"}, {"id": "Small-Flower Pawpaw", "label": "Small-Flower Pawpaw", "kingdom": "Plantae", "className": "Magnoliopsida", "url": "https://www.inaturalist.org/observations/221016471", "description": "This is the nicest looking wild pawpaw on the property. Seems to be a good combo of enough leaf litter (large oaks and magnolias nearby) and not too much shade. There is one larger than this at the edge of the forested area. It has the best soil but also the least light. It never seems to have any fruit. There are several other smaller ones in sunnier sandier areas. I have never gotten to try the fruit since animals always get them first. They are great for attracting Zebra Swallowtails though. Caterpillar on this bush: https://www.inaturalist.org/observations/221016473\n\nIt's too expensive to water the garden enough for most vegetables with such sandy soil. Hence the container gardening. So this pawpaw is not getting any special treatment. It looked terrible during the severe drought last year (some wild bushes and trees died), but it bounced right back.", "iconicTaxon": "Plantae"}, {"id": "Smalltooth Cookiecutter Shark", "label": "Smalltooth Cookiecutter Shark", "kingdom": "Animalia", "className": "Elasmobranchii", "url": "https://www.inaturalist.org/observations/140816220", "description": "On the dorsal fin of a couple Baird's beaked whales", "iconicTaxon": "Animalia"}, {"id": "Smoketree Sharpshooter", "label": "Smoketree Sharpshooter", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/138332467", "description": "A dead Sharpshooter being eaten by a Red-shouldered Bug inside Hedco Hall.", "iconicTaxon": "Insecta"}, {"id": "Smooth Newt", "label": "Smooth Newt", "kingdom": "Animalia", "className": "Amphibia", "url": "https://www.inaturalist.org/observations/151156146", "description": "Not the Little Grebe!", "iconicTaxon": "Amphibia"}, {"id": "Snake Prickleback", "label": "Snake Prickleback", "kingdom": "Animalia", "className": "Actinopterygii", "url": "https://www.inaturalist.org/observations/28343219", "description": "Being eaten by a Great Blue Heron.", "iconicTaxon": "Actinopterygii"}, {"id": "Snow Goose", "label": "Snow Goose", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/145302194", "description": "Dead bird", "iconicTaxon": "Aves"}, {"id": "Snow King Pleco", "label": "Snow King Pleco", "kingdom": "Animalia", "className": "Actinopterygii", "url": "https://www.inaturalist.org/observations/255875087", "description": "Photo by @ lazza100748 (on instagram)", "iconicTaxon": "Actinopterygii"}, {"id": "Sockeye Salmon", "label": "Sockeye Salmon", "kingdom": "Animalia", "className": "Actinopterygii", "url": "https://www.inaturalist.org/observations/194404352", "description": "Unidentified", "iconicTaxon": "Actinopterygii"}, {"id": "Solenostemma arghel", "label": "Solenostemma arghel", "kingdom": "Plantae", "className": "Magnoliopsida", "url": "https://www.inaturalist.org/observations/253504877", "description": "Unidentified", "iconicTaxon": "Plantae"}, {"id": "Song Sparrow", "label": "Song Sparrow", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/71537182", "description": "Eating another Song Sparrow", "iconicTaxon": "Aves"}, {"id": "Song Thrush", "label": "Song Thrush", "kingdom": "A ", "kingdom": "Animalia", "className": "Reptilia", "url": "https://www.inaturalist.org/observations/70351555", "description": "Unidentified", "iconicTaxon": "Reptilia"}, {"id": "Three-striped Ermine", "label": "Three-striped Ermine", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/87534460", "description": "See predator  https://www.inaturalist.org/observations/87534459\nSee pupa https://www.inaturalist.org/observations/91295217\nSee imago https://www.inaturalist.org/observations/91295226\n\nBirdy dropped the larva and had to be satisfied with a much smaller insect.\n\nAt first reminded me of Saenura flava.  Maybe something close to it?\n\nFound in the middle of the road.  Tried a smorgasbord, but no signs of feeding, except for frass.  Maybe pre pupating?", "iconicTaxon": "Insecta"}, {"id": "Threespine Stickleback", "label": "Threespine Stickleback", "kingdom": "Animalia", "className": "Actinopterygii", "url": "https://www.inaturalist.org/observations/73707609", "description": "Unidentified", "iconicTaxon": "Actinopterygii"}, {"id": "Tidepool Sculpin", "label": "Tidepool Sculpin", "kingdom": "Animalia", "className": "Actinopterygii", "url": "https://www.inaturalist.org/observations/206509548", "description": "Identification is for the fish in the gull's beak. Gull is entered as a separate observation.", "iconicTaxon": "Actinopterygii"}, {"id": "Tiger Flatworm", "label": "Tiger Flatworm", "kingdom": "Animalia", "className": "Unidentified", "url": "https://www.inaturalist.org/observations/250956763", "description": "Unidentified", "iconicTaxon": "Animalia"}, {"id": "Tiger Snake", "label": "Tiger Snake", "kingdom": "Animalia", "className": "Reptilia", "url": "https://www.inaturalist.org/observations/78322290", "description": "Unidentified", "iconicTaxon": "Reptilia"}, {"id": "Tomentose Burying Beetle", "label": "Tomentose Burying Beetle", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/124327907", "description": "Feeding on a deceased vole in a window well.", "iconicTaxon": "Insecta"}, {"id": "Topsmelt Silverside", "label": "Topsmelt Silverside", "kingdom": "Animalia", "className": "Actinopterygii", "url": "https://www.inaturalist.org/observations/221046420", "description": "Unidentified", "iconicTaxon": "Actinopterygii"}, {"id": "Toque Macaque", "label": "Toque Macaque", "kingdom": "Animalia", "className": "Mammalia", "url": "https://www.inaturalist.org/observations/227235955", "description": "Prey Item", "iconicTaxon": "Mammalia"}, {"id": "Trailing Bitter-tea", "label": "Trailing Bitter-tea", "kingdom": "Plantae", "className": "Magnoliopsida", "url": "https://www.inaturalist.org/observations/86379203", "description": "Unidentified", "iconicTaxon": "Plantae"}, {"id": "Trailing bellflower", "label": "Trailing bellflower", "kingdom": "Plantae", "className": "Magnoliopsida", "url": "https://www.inaturalist.org/observations/222851612", "description": "Unidentified", "iconicTaxon": "Plantae"}, {"id": "Translucent Ermine", "label": "Translucent Ermine", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/108860079", "description": "Unidentified", "iconicTaxon": "Insecta"}, {"id": "Tree Bumble Bee", "label": "Tree Bumble Bee", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/162981513", "description": "Unidentified", "iconicTaxon": "Insecta"}, {"id": "Triangulate Combfoot", "label": "Triangulate Combfoot", "kingdom": "Animalia", "className": "Arachnida", "url": "https://www.inaturalist.org/observations/19296614", "description": "7 part photostory, this one is for the spider which can be seen in 2nd and succeeding photos.\nPhoto 1: \nI Thought It Was A Yellowjacket \nWhen I came inside my house, what I thought was a yellow jacket came in with me. This is a problem because I like to go barefoot and I have cats that could get stung also. I went to get a broom to try to slap it down out of the air. When I came back it had gone to a window with blinds. I discovered that a tiny spider had solved my problem. The \"yellow jacket\" had been caught in a web. Later when I got the insect identified by experts, it turned out to be a fly pretending to be a yellow jacket. This is an example of Batesian mimicry which is when a harmless, tasty species mimics another species that is toxic or foul tasting or dangerous in order to be protected from predators. Sure fooled me. It did not deter the spider. \nPhoto 2: \nSpider To The Rescue \nThe spider solved my problem. Here is the spider coming to take a look at what it caught in its web. I was shooting these photos through open blinds. \nPhoto 3: \nUnderside Of The Spider \nI took this shot to help with getting an id on the spider. \nPhoto 4: \nTopside Of The Spider \nAs the spider wrapped some silk around the fly's legs, I got a shot of the top side of the spider. \nPhoto 5: \nUncropped Shot For Perspective \nI left this shot uncropped to show how I was having to do this, shooting between two blinds slats. \nPhoto 6: \nSpider Injects venom \nThe spider may have been fooled by the mimicry because it avoided the end of the fly where a stinger would be if it were a wasp. What the spider did, as shown here, was to bite the leg which injected venom. The fly stopped struggling shortly after that. \nPhoto 7: \nThe Spider Won \nI had to leave at this point so took this last photo of the spider. Several hours later when I got back the fly was wrapped up in silk for a later meal. The next morning there was nothing left to be seen.        ", "iconicTaxon": "Arachnida"}, {"id": "Tridax daisy", "label": "Tridax daisy", "kingdom": "Plantae", "className": "Magnoliopsida", "url": "https://www.inaturalist.org/observations/72616635", "description": "See butterfly  https://www.inaturalist.org/observations/72616632", "iconicTaxon": "Plantae"}, {"id": "Tropical Carpenter Ant", "label": "Tropical Carpenter Ant", "kingdom": "Animalia", "className": "Insecta", "url": "https://www.inaturalist.org/observations/262520602", "description": "A formiga ", "iconicTaxon": "Insecta"}, {"id": "Tropical House Gecko", "label": "Tropical House Gecko", "kingdom": "Animalia", "className": "Reptilia", "url": "https://www.inaturalist.org/observations/18141580", "description": "Unidentified", "iconicTaxon": "Reptilia"}, {"id": "Tropical Mockingbird", "label": "Tropical Mockingbird", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/69384807", "description": "Observation for the prey not the falcon", "iconicTaxon": "Aves"}, {"id": "Trumpeter Hornbill", "label": "Trumpeter Hornbill", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/144668595", "description": "Unidentified", "iconicTaxon": "Aves"}, {"id": "Tufted Titmouse", "label": "Tufted Titmouse", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/7871131", "description": "Freshly killed, maybe by a hawk. It had a gash in its neck.\n\nRelated observation:\nhttps://www.inaturalist.org/observations/7871201", "iconicTaxon": "Aves"}, {"id": "Tuftless Olive Sunbird", "label": "Tuftless Olive Sunbird", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/106550271", "description": "Unidentified", "iconicTaxon": "Aves"}, {"id": "Turkey Vulture", "label": "Turkey Vulture", "kingdom": "Animalia", "className": "Aves", "url": "https://www.inaturalist.org/observations/19930651", "description": "Turkey Vulture devouring a very young and dead great white shark.", "iconicTaxon": "Aves"}, {"id": "Turner's Thick-toed Gecko", "label": "Turner's Thick-toed Gecko", "kingdom": "Animalia", "className": "Reptilia", "url": "https://www.inaturalist.org/observations/103096282", "description": "Unidentified", "iconicTaxon": "Reptilia"}, {"id": "Two-lined Spittlebug", "label": "Two-lined Spittl       const dpr = window.devicePixelRatio || 1;

      const svg = d3.select('#network');
      const tooltip = d3.select('#tooltip');

      const width = window.innerWidth;
      const height = window.innerHeight;

      svg.attr('viewBox', [0, 0, width, height]);

      const defs = svg.append('defs');
      defs.append('marker')
        .attr('id', 'arrowhead')
        .attr('viewBox', '0 -5 10 10')
        .attr('refX', 16)
        .attr('refY', 0)
        .attr('markerWidth', 8)
        .attr('markerHeight', 8)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M0,-5L10,0L0,5')
        .attr('fill', 'rgba(30, 41, 59, 0.65)');

      const zoomLayer = svg.append('g');

      const link = zoomLayer.append('g')
        .attr('stroke-linecap', 'round')
        .selectAll('line')
        .data(graphData.links)
        .join('line')
        .attr('class', 'link')
        .attr('stroke-width', d => Math.max(0.03 + d.count, 0.75))
        .attr('marker-end', 'url(#arrowhead)');

      const node = zoomLayer.append('g')
        .selectAll('g')
        .data(graphData.nodes)
        .join('g')
        .attr('class', 'node')
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended));

      node.append('circle')
        .attr('r', 8)
        .attr('fill', d => colorMap[d.iconicTaxon] || '#94a3b8');

      node.append('text')
        .attr('x', 8 + 3)
        .attr('y', 3)
        .attr('fill', '#0f172a')
        .text(d => d.label);

      node.append('title')
        .text(d => `${d.label}
Iconic taxon: ${d.iconicTaxon}`);

      node.on('mouseenter', (event, d) => {
        tooltip.style('opacity', 1)
          .html(`
            <strong>${d.label}</strong><br/>
            Iconic taxon: ${d.iconicTaxon}<br/>
            Kingdom: ${d.kingdom}<br/>
            Class: ${d.className}<br/>
            ${d.description !== 'Unidentified' ? `Description: ${d.description}<br/>` : ''}
            ${d.url !== 'Unidentified' ? `<a href="${d.url}" target="_blank" rel="noopener noreferrer">View observation</a>` : ''}
          `);
      }).on('mousemove', (event) => {
        const [x, y] = d3.pointer(event);
        tooltip
          .style('left', `${x + 20}px`)
          .style('top', `${y + 20}px`);
      }).on('mouseleave', () => tooltip.style('opacity', 0));

      const simulation = d3.forceSimulation(graphData.nodes)
        .force('link', d3.forceLink(graphData.links).id(d => d.id).distance(80).strength(0.2))
        .force('charge', d3.forceManyBody().strength(-80))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collide', d3.forceCollide(8 * 1.8));

      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);

        node
          .attr('transform', d => `translate(${d.x},${d.y})`);
      });

      const zoomBehaviour = d3.zoom()
        .scaleExtent([0.1, 5])
        .on('zoom', (event) => {
          zoomLayer.attr('transform', event.transform);
        });

      svg.call(zoomBehaviour);

      const searchInput = document.getElementById('searchBox');
      const searchButton = document.getElementById('searchButton');

      function clearHighlights() {
        node.classed('highlight', false);
        link.classed('highlight', false);
      }

      function focusNode(nodeData) {
        const scale = 1.6;
        const transform = d3.zoomIdentity
          .translate(width / 2, height / 2)
          .scale(scale)
          .translate(-nodeData.x, -nodeData.y);

        svg.transition().duration(650).call(zoomBehaviour.transform, transform);
      }

      function highlightNode(value) {
        const term = value.trim().toLowerCase();
        if (!term) {
          clearHighlights();
          return;
        }
        const match = graphData.nodes.find((n) => n.id.toLowerCase() === term);
        clearHighlights();
        if (match) {
          node.filter(d => d.id === match.id).classed('highlight', true);
          link.filter(d => d.source.id === match.id || d.target.id === match.id)
            .classed('highlight', true);
          focusNode(match);
        } else {
          alert(`No match found for "${value}"`);
        }
      }

      searchButton.addEventListener('click', () => highlightNode(searchInput.value));
      searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          highlightNode(searchInput.value);
        }
        if (event.key === 'Escape') {
          clearHighlights();
          searchInput.value = '';
        }
      });

      const legend = document.getElementById('legend');
      Object.entries(colorMap).forEach(([taxon, color]) => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `<span class="legend-color" style="background:${color}"></span> ${taxon}`;
        legend.appendChild(item);
      });

      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }

      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }

      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }

      window.addEventListener('resize', () => {
        const newWidth = window.innerWidth;
        const newHeight = window.innerHeight;
        svg.attr('viewBox', [0, 0, newWidth, newHeight]);
        simulation.force('center', d3.forceCenter(newWidth / 2, newHeight / 2));
        simulation.alphaTarget(0.1).restart();
        setTimeout(() => simulation.alphaTarget(0), 500);
      });
    </script>
  </body>
</html>
